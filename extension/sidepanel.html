<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open WebUI 網頁助手</title><link rel="stylesheet" href="standalone.css"></head><body>
<header><button id="history-button" class="icon" aria-label="歷史對談" title="歷史對談">☰</button><strong>Open WebUI 助手</strong><span class="spacer"></span><button id="new-chat" class="icon" aria-label="新增對談" title="新增對談">＋</button><button id="settings-button" class="icon" aria-label="擴充功能設定" title="設定"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m10 3-1 3-3 1-2-1-2 4 2 2v3l-1 2 4 3 2-2 3 1 1 2 4-1v-3l2-2 3-1-1-4-3-1-1-3-4-1Z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
<div class="source-bar"><span id="connection-dot"></span><span id="connection-label">尚未設定來源</span><button id="reload-models" class="link" title="重新載入模型">更新模型</button></div>
<div id="page-state" class="page-state" role="status">每次送出都會讀取目前網頁</div><div id="notice" role="status" hidden></div>
<section id="approval" hidden aria-live="polite"><strong>需要你的確認</strong><p id="approval-label"></p><pre id="approval-value" hidden></pre><div class="row"><button id="deny" class="quiet">拒絕</button><button id="allow">允許這次動作</button></div></section>
<main id="conversation" aria-live="polite"><div id="welcome"><h1>研究你正在看的網頁</h1><p>選擇模型，直接提問。網頁內容會自動帶入。</p><div id="starters"></div></div><div id="messages"></div></main>
<form id="composer"><label class="sr" for="prompt">訊息</label><textarea id="prompt" rows="2" placeholder="詢問目前網頁…"></textarea><div class="row"><label class="sr" for="model">模型</label><select id="model" aria-label="選擇模型"><option value="">請先連接模型來源</option></select><button id="send" type="submit" aria-label="送出訊息">送出</button><button id="stop" type="button" class="quiet" hidden>停止</button></div></form>
<dialog id="settings"><form id="settings-form"><div class="dialog-heading"><h2>擴充功能設定</h2><button type="button" id="close-settings" class="icon" aria-label="關閉設定">×</button></div>
<label for="connection-mode">連線方式</label><select id="connection-mode"><option value="openwebui">Open WebUI（同步來源與對談）</option><option value="ollama">直接連 Ollama（獨立使用）</option></select><p class="help">兩種方式都不需要安裝桌面 App 或 Edge Bridge 服務。</p>
<div id="webui-fields"><label for="webui-url">Open WebUI 伺服器網址</label><input id="webui-url" type="text" autocomplete="url" placeholder="http://192.168.50.166:3000"><p class="help">可連接其他電腦、NAS、Docker 或雲端的 Open WebUI。</p><div id="login-fields"><label for="login-email">Open WebUI 帳號</label><input id="login-email" type="email" autocomplete="username"><label for="login-password">密碼</label><input id="login-password" type="password" autocomplete="current-password"><button type="button" id="login-button">登入並讀取來源</button></div><div id="account" hidden><p id="account-name"></p><button id="logout" type="button" class="quiet">登出</button></div><p class="help">登入憑證只保留至這次瀏覽器工作階段結束；不保存密碼。</p></div>
<label for="ollama-url">Ollama 來源 IP／網址</label><input id="ollama-url" type="text" autocomplete="off" placeholder="192.168.50.166:11434"><p id="scope-help" class="help">儲存來源會同步套用到這台 Open WebUI 的網頁與手機 App。</p><div id="provider-choice" hidden><label for="provider-index">要調整的 Ollama 連線</label><select id="provider-index"></select></div>
<p id="settings-status" role="status"></p><div class="row"><button id="test-source" type="button" class="quiet">測試來源連線</button><button id="save-settings" type="submit">儲存並載入模型</button></div></form></dialog>
<dialog id="history"><div class="dialog-heading"><h2>歷史對談</h2><button id="close-history" class="icon" aria-label="關閉歷史對談">×</button></div><div id="history-list"></div></dialog>
<script src="standalone-core.js"></script><script src="standalone-api.js"></script><script src="agent-page.js"></script><script src="page-functions.js"></script><script src="standalone-ui.js"></script></body></html>
